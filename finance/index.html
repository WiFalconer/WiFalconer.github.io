<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ClearPath Finance</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>

  <!-- Main Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Safe React wrapper for Lucide UMD icons so React never crashes on mount locally or on GitHub Pages
    const LucideIcon = ({ name, className = "w-4 h-4" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

    const Wallet = (p) => <LucideIcon name="wallet" {...p} />;
    const CreditCard = (p) => <LucideIcon name="credit-card" {...p} />;
    const TrendingUp = (p) => <LucideIcon name="trending-up" {...p} />;
    const Share2 = (p) => <LucideIcon name="share-2" {...p} />;
    const Plus = (p) => <LucideIcon name="plus" {...p} />;
    const Trash2 = (p) => <LucideIcon name="trash-2" {...p} />;
    const Download = (p) => <LucideIcon name="download" {...p} />;
    const Upload = (p) => <LucideIcon name="upload" {...p} />;
    const Check = (p) => <LucideIcon name="check" {...p} />;
    const AlertCircle = (p) => <LucideIcon name="alert-circle" {...p} />;
    const GraduationCap = (p) => <LucideIcon name="graduation-cap" {...p} />;
    const CopyIcon = (p) => <LucideIcon name="copy" {...p} />;
    const RefreshCw = (p) => <LucideIcon name="refresh-cw" {...p} />;

    const SAMPLE_DATA = {
      version: '1.1',
      metadata: {
        user_name: 'Alex (Sample Profile)',
        updated_at: new Date().toISOString()
      },
      income: [
        { id: 'inc_1', source: 'Primary Salary (Net)', monthly_amount: 4800 },
        { id: 'inc_2', source: 'Weekend Freelance', monthly_amount: 450 }
      ],
      expenses: [
        { id: 'exp_1', name: 'Rent & Utilities', amount: 1750, category: 'Need' },
        { id: 'exp_2', name: 'Groceries & Household', amount: 520, category: 'Need' },
        { id: 'exp_3', name: 'Auto Insurance & Gas', amount: 280, category: 'Need' },
        { id: 'exp_4', name: 'Dining Out & Coffee', amount: 340, category: 'Want' },
        { id: 'exp_5', name: 'Subscriptions & Gym', amount: 110, category: 'Want' },
        { id: 'exp_6', name: '401(k) / Roth IRA', amount: 650, category: 'Invest' },
        { id: 'exp_7', name: 'Emergency HYSA', amount: 250, category: 'Invest' }
      ],
      debts: [
        { id: 'debt_1', name: 'Chase Sapphire Card', balance: 4800, interest_rate_apr: 23.99, minimum_payment: 145 },
        { id: 'debt_2', name: 'Personal Consolidation Loan', balance: 7200, interest_rate_apr: 11.5, minimum_payment: 215 },
        { id: 'debt_3', name: 'Auto Loan', balance: 11500, interest_rate_apr: 5.9, minimum_payment: 295 }
      ],
      studentLoans: [
        { id: 'sl_1', name: 'Federal Direct Unsubsidized', balance: 24500, interest_rate_apr: 6.53, loan_type: 'federal' },
        { id: 'sl_2', name: 'Federal Direct Subsidized', balance: 11500, interest_rate_apr: 4.99, loan_type: 'federal' }
      ],
      studentLoanConfig: {
        strategy: 'standard',
        familySize: 1,
        pslfMonthsCompleted: 24,
        refiRate: 4.5,
        extraStudentPayment: 100
      }
    };

    const EMPTY_DATA = {
      version: '1.1',
      metadata: { user_name: '', updated_at: new Date().toISOString() },
      income: [],
      expenses: [],
      debts: [],
      studentLoans: [],
      studentLoanConfig: { strategy: 'standard', familySize: 1, pslfMonthsCompleted: 0, refiRate: 4.5, extraStudentPayment: 0 }
    };

    const STORAGE_KEY = 'fintrack_selfhosted_v1';

    const formatCurrency = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num);
    };

    const formatCurrencyExact = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    };

    const generateId = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

    function simulateDebtPayoff(debts, extraMonthlyPayment = 0, strategy = 'avalanche') {
      if (!debts || debts.length === 0) {
        return { months: 0, totalInterest: 0, totalPaid: 0, payoffDate: 'Debt Free Now', schedule: [], payoffOrder: [], capped: false };
      }

      let activeDebts = debts.filter(d => d.balance > 0).map(d => ({
        ...d,
        remaining: Number(d.balance),
        apr: Number(d.interest_rate_apr) || 0,
        minPayment: Number(d.minimum_payment) || 0,
        interestPaid: 0,
        paidOffMonth: null
      }));

      if (activeDebts.length === 0) {
        return { months: 0, totalInterest: 0, totalPaid: 0, payoffDate: 'Debt Free Now', schedule: [], payoffOrder: [], capped: false };
      }

      const MAX_MONTHS = 360;
      let months = 0;
      let totalInterest = 0;
      let totalPaid = 0;
      const schedule = [];
      const payoffOrder = [];

      schedule.push({ month: 0, balance: activeDebts.reduce((sum, d) => sum + d.remaining, 0) });

      while (activeDebts.some(d => d.remaining > 0.01) && months < MAX_MONTHS) {
        months += 1;
        const sortedTargets = [...activeDebts].filter(d => d.remaining > 0.01).sort((a, b) => {
          if (strategy === 'avalanche') return b.apr - a.apr || a.remaining - b.remaining;
          return a.remaining - b.remaining || b.apr - a.apr;
        });

        for (const d of activeDebts) {
          if (d.remaining > 0.01) {
            const interestCharge = d.remaining * (d.apr / 100 / 12);
            d.remaining += interestCharge;
            d.interestPaid += interestCharge;
            totalInterest += interestCharge;
          }
        }

        let extraPool = Math.max(0, Number(extraMonthlyPayment) || 0);

        for (const d of activeDebts) {
          if (d.remaining <= 0.01) {
            extraPool += d.minPayment;
            continue;
          }
          const payment = Math.min(d.remaining, d.minPayment);
          d.remaining -= payment;
          totalPaid += payment;

          if (d.remaining <= 0.01) {
            d.remaining = 0;
            d.paidOffMonth = months;
            payoffOrder.push({ id: d.id, name: d.name, apr: d.apr, originalBalance: d.balance, month: months, interestPaid: d.interestPaid });
            extraPool += Math.max(0, d.minPayment - payment);
          }
        }

        for (const target of sortedTargets) {
          if (extraPool <= 0.01) break;
          if (target.remaining <= 0.01) continue;
          const extraApplied = Math.min(target.remaining, extraPool);
          target.remaining -= extraApplied;
          extraPool -= extraApplied;
          totalPaid += extraApplied;

          if (target.remaining <= 0.01 && target.paidOffMonth === null) {
            target.remaining = 0;
            target.paidOffMonth = months;
            payoffOrder.push({ id: target.id, name: target.name, apr: target.apr, originalBalance: target.balance, month: months, interestPaid: target.interestPaid });
          }
        }

        schedule.push({ month: months, balance: Math.max(0, activeDebts.reduce((sum, d) => sum + d.remaining, 0)) });
      }

      const targetDate = new Date();
      targetDate.setMonth(targetDate.getMonth() + months);
      const payoffDate = months >= MAX_MONTHS ? '30+ Years' : targetDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

      return { months, totalInterest, totalPaid, payoffDate, schedule, payoffOrder, capped: months >= MAX_MONTHS };
    }

    function App() {
      const [activeTab, setActiveTab] = useState('budget');
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.income)) return { ...SAMPLE_DATA, ...parsed };
          }
        } catch (e) { console.error(e); }
        return SAMPLE_DATA;
      });

      const [toast, setToast] = useState(null);
      const [confirmClear, setConfirmClear] = useState(false);
      const [payoffStrategy, setPayoffStrategy] = useState('avalanche');
      const [extraPayment, setExtraPayment] = useState(200);
      const [hasInitializedExtra, setHasInitializedExtra] = useState(false);

      const [incSource, setIncSource] = useState('');
      const [incAmount, setIncAmount] = useState('');
      const [expName, setExpName] = useState('');
      const [expAmount, setExpAmount] = useState('');
      const [expCategory, setExpCategory] = useState('Need');
      const [debtName, setDebtName] = useState('');
      const [debtBalance, setDebtBalance] = useState('');
      const [debtApr, setDebtApr] = useState('');
      const [debtMin, setDebtMin] = useState('');
      const [slName, setSlName] = useState('');
      const [slBalance, setSlBalance] = useState('');
      const [slApr, setSlApr] = useState('');
      const [slType, setSlType] = useState('federal');
      const [copiedJson, setCopiedJson] = useState(false);
      const fileInputRef = useRef(null);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.error(e); }
      }, [data]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(prev => prev?.message === message ? null : prev), 3500);
      };

      const studentLoanMetrics = useMemo(() => {
        const loans = data.studentLoans || [];
        const cfg = data.studentLoanConfig || SAMPLE_DATA.studentLoanConfig;
        const totalBalance = loans.reduce((sum, l) => sum + (Number(l.balance) || 0), 0);
        const federalBalance = loans.filter(l => l.loan_type === 'federal').reduce((sum, l) => sum + (Number(l.balance) || 0), 0);
        const weightedApr = totalBalance > 0 ? loans.reduce((sum, l) => sum + (Number(l.balance) || 0) * (Number(l.interest_rate_apr) || 0), 0) / totalBalance : 0;
        const monthlyInterest = loans.reduce((sum, l) => sum + ((Number(l.balance) || 0) * ((Number(l.interest_rate_apr) || 0) / 100)) / 12, 0);

        const calcMonthlyPmt = (principal, aprPct, months) => {
          if (principal <= 0) return 0;
          const r = aprPct / 100 / 12;
          if (r === 0) return principal / months;
          return (principal * (r * Math.pow(1 + r, months))) / (Math.pow(1 + r, months) - 1);
        };

        const totalMonthlyIncome = data.income.reduce((sum, item) => sum + (Number(item.monthly_amount) || 0), 0);
        const estimatedAnnualGross = totalMonthlyIncome * 12 * 1.22;
        const povertyLine = 15060 + (Math.max(1, cfg.familySize || 1) - 1) * 5380;
        const discretionaryIncome = Math.max(0, estimatedAnnualGross - 1.5 * povertyLine);
        const standardBasePmt = calcMonthlyPmt(totalBalance, weightedApr, 120);
        const standardTotalPmt = totalBalance > 0 ? standardBasePmt + (Number(cfg.extraStudentPayment) || 0) : 0;
        const idrMonthlyPmt = federalBalance > 0 ? Math.min(standardBasePmt, (discretionaryIncome * 0.1) / 12) : standardBasePmt;
        const refiMonthlyPmt = calcMonthlyPmt(totalBalance, Number(cfg.refiRate) || 4.5, 120);

        let activeMonthlyPayment = 0;
        if (totalBalance > 0) {
          if (cfg.strategy === 'standard') activeMonthlyPayment = standardTotalPmt;
          else if (cfg.strategy === 'idr' || cfg.strategy === 'pslf') activeMonthlyPayment = idrMonthlyPmt;
          else if (cfg.strategy === 'refi') activeMonthlyPayment = refiMonthlyPmt;
        }

        return { totalBalance, federalBalance, weightedApr, monthlyInterest, standardBasePmt, standardTotalPmt, idrMonthlyPmt, refiMonthlyPmt, activeMonthlyPayment, recommendedStrategy: 'standard', recommendationReason: 'Aggressive 10-year schedule recommended.' };
      }, [data.studentLoans, data.studentLoanConfig, data.income]);

      const metrics = useMemo(() => {
        const totalIncome = data.income.reduce((sum, item) => sum + (Number(item.monthly_amount) || 0), 0);
        const needTotal = data.expenses.filter(e => e.category === 'Need').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const wantTotal = data.expenses.filter(e => e.category === 'Want').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const investTotal = data.expenses.filter(e => e.category === 'Invest').reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const totalExpenses = needTotal + wantTotal + investTotal;
        const totalDebtBalance = data.debts.reduce((sum, d) => sum + (Number(d.balance) || 0), 0);
        const totalDebtMinimums = data.debts.reduce((sum, d) => sum + (Number(d.minimum_payment) || 0), 0);
        const studentLoanPayment = studentLoanMetrics.activeMonthlyPayment;
        const monthlyInterestBleed = data.debts.reduce((sum, d) => sum + ((Number(d.balance) || 0) * (Number(d.interest_rate_apr) / 100)) / 12, 0);
        const netCashFlow = totalIncome - (totalExpenses + totalDebtMinimums + studentLoanPayment);
        const needPct = totalIncome > 0 ? ((needTotal + totalDebtMinimums + studentLoanPayment) / totalIncome) * 100 : 0;
        const wantPct = totalIncome > 0 ? (wantTotal / totalIncome) * 100 : 0;
        const investPct = totalIncome > 0 ? (investTotal / totalIncome) * 100 : 0;

        return { totalIncome, needTotal, wantTotal, investTotal, totalExpenses, totalDebtBalance, totalDebtMinimums, studentLoanPayment, monthlyInterestBleed, netCashFlow, needPct, wantPct, investPct };
      }, [data, studentLoanMetrics.activeMonthlyPayment]);

      useEffect(() => {
        if (!hasInitializedExtra && metrics.netCashFlow > 0) {
          setExtraPayment(Math.round(metrics.netCashFlow));
          setHasInitializedExtra(true);
        }
      }, [metrics.netCashFlow, hasInitializedExtra]);

      const baselineSim = useMemo(() => simulateDebtPayoff(data.debts, 0, payoffStrategy), [data.debts, payoffStrategy]);
      const acceleratedSim = useMemo(() => simulateDebtPayoff(data.debts, extraPayment, payoffStrategy), [data.debts, extraPayment, payoffStrategy]);

      const handleAddIncome = (e) => {
        e.preventDefault();
        const amt = parseFloat(incAmount);
        if (!incSource.trim() || isNaN(amt) || amt <= 0) return showToast('Enter valid income.', 'error');
        setData(prev => ({ ...prev, income: [...prev.income, { id: generateId('inc'), source: incSource.trim(), monthly_amount: amt }] }));
        setIncSource(''); setIncAmount(''); showToast('Income added');
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        const amt = parseFloat(expAmount);
        if (!expName.trim() || isNaN(amt) || amt <= 0) return showToast('Enter valid expense.', 'error');
        setData(prev => ({ ...prev, expenses: [...prev.expenses, { id: generateId('exp'), name: expName.trim(), amount: amt, category: expCategory }] }));
        setExpName(''); setExpAmount(''); showToast('Expense added');
      };

      const handleAddDebt = (e) => {
        e.preventDefault();
        const bal = parseFloat(debtBalance), apr = parseFloat(debtApr), min = parseFloat(debtMin);
        if (!debtName.trim() || isNaN(bal) || isNaN(apr) || isNaN(min)) return showToast('Enter valid debt info.', 'error');
        setData(prev => ({ ...prev, debts: [...prev.debts, { id: generateId('debt'), name: debtName.trim(), balance: bal, interest_rate_apr: apr, minimum_payment: min }] }));
        setDebtName(''); setDebtBalance(''); setDebtApr(''); setDebtMin(''); showToast('Debt added');
      };

      const handleAddStudentLoan = (e) => {
        e.preventDefault();
        const bal = parseFloat(slBalance), apr = parseFloat(slApr);
        if (!slName.trim() || isNaN(bal) || isNaN(apr)) return showToast('Enter valid student loan.', 'error');
        setData(prev => ({ ...prev, studentLoans: [...(prev.studentLoans || []), { id: generateId('sl'), name: slName.trim(), balance: bal, interest_rate_apr: apr, loan_type: slType }] }));
        setSlName(''); setSlBalance(''); setSlApr(''); showToast('Student loan added');
      };

      const getExportPayload = () => JSON.stringify(data, null, 2);
      
      const handleShareOrExport = () => {
        const blob = new Blob([getExportPayload()], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'finance-profile.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        showToast('Downloaded profile JSON');
      };

      const processImportedJson = (rawText) => {
        try {
          const parsed = JSON.parse(rawText);
          if (parsed && Array.isArray(parsed.income)) {
            setData(parsed);
            setActiveTab('dashboard');
            showToast('Profile loaded successfully');
          }
        } catch (err) { showToast('Invalid JSON file', 'error'); }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-24">
          <header className="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
            <div className="max-w-2xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center">
                  <TrendingUp className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-base font-bold text-white">ClearPath Finance</h1>
                  <p className="text-xs text-slate-400">{data.metadata?.user_name || 'Local Profile'}</p>
                </div>
              </div>
              <button onClick={() => setActiveTab('share')} className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-medium text-emerald-400 flex items-center gap-1.5">
                <Share2 className="w-3.5 h-3.5" /> Sync
              </button>
            </div>
          </header>

          {toast && (
            <div className="fixed top-16 left-4 right-4 z-50 flex justify-center pointer-events-none">
              <div className={`px-4 py-2 rounded-xl shadow-xl border text-sm font-medium flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-950 border-rose-500 text-rose-200' : 'bg-emerald-950 border-emerald-500 text-emerald-200'}`}>
                {toast.type === 'error' ? <AlertCircle className="w-4 h-4" /> : <Check className="w-4 h-4" />}
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          <main className="flex-1 w-full max-w-2xl mx-auto px-4 pt-4 space-y-5">
            {activeTab === 'budget' && (
              <div className="space-y-5 animate-fadeIn">
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                  <div className="flex justify-between">
                    <div>
                      <p className="text-xs uppercase text-slate-400">Monthly Take-Home</p>
                      <p className="text-2xl font-extrabold text-white">{formatCurrency(metrics.totalIncome)}</p>
                    </div>
                    <div className="text-right">
                      <p className="text-xs uppercase text-slate-400">Free Cash Flow</p>
                      <p className={`text-xl font-bold ${metrics.netCashFlow >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {metrics.netCashFlow >= 0 ? '+' : ''}{formatCurrency(metrics.netCashFlow)}
                      </p>
                    </div>
                  </div>
                  <div className="h-3.5 w-full bg-slate-800 rounded-full overflow-hidden flex p-0.5 gap-0.5">
                    <div style={{ width: `${Math.min(100, metrics.needPct)}%` }} className="bg-sky-500 h-full rounded-l-full" />
                    <div style={{ width: `${Math.min(100, metrics.wantPct)}%` }} className="bg-amber-400 h-full" />
                    <div style={{ width: `${Math.min(100, metrics.investPct)}%` }} className="bg-emerald-500 h-full rounded-r-full" />
                  </div>
                </section>

                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-bold uppercase text-slate-300">Income Sources</h2>
                  <form onSubmit={handleAddIncome} className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                    <input type="text" placeholder="Source" value={incSource} onChange={e => setIncSource(e.target.value)} className="sm:col-span-6 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    <input type="number" placeholder="Amount" value={incAmount} onChange={e => setIncAmount(e.target.value)} className="sm:col-span-4 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    <button type="submit" className="sm:col-span-2 bg-emerald-600 rounded-xl h-11 text-white font-semibold flex items-center justify-center"><Plus className="w-4 h-4" /></button>
                  </form>
                  <ul className="divide-y divide-slate-800">
                    {data.income.map(item => (
                      <li key={item.id} className="py-2.5 flex justify-between text-sm">
                        <span>{item.source}</span>
                        <div className="flex gap-3 items-center">
                          <span className="text-emerald-400 font-bold">{formatCurrency(item.monthly_amount)}</span>
                          <button onClick={() => setData(p => ({ ...p, income: p.income.filter(i => i.id !== item.id) }))} className="text-slate-500 hover:text-rose-400"><Trash2 className="w-4 h-4" /></button>
                        </div>
                      </li>
                    ))}
                  </ul>
                </section>

                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-bold uppercase text-slate-300">Expenses</h2>
                  <form onSubmit={handleAddExpense} className="space-y-2">
                    <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                      <input type="text" placeholder="Expense Name" value={expName} onChange={e => setExpName(e.target.value)} className="sm:col-span-7 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                      <input type="number" placeholder="Amount" value={expAmount} onChange={e => setExpAmount(e.target.value)} className="sm:col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    </div>
                    <div className="flex gap-2">
                      {['Need', 'Want', 'Invest'].map(cat => (
                        <button type="button" key={cat} onClick={() => setExpCategory(cat)} className={`flex-1 h-10 rounded-xl text-xs font-semibold border ${expCategory === cat ? 'bg-sky-500/20 border-sky-400 text-sky-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>{cat}</button>
                      ))}
                      <button type="submit" className="px-5 bg-indigo-600 rounded-xl text-white text-sm font-semibold h-10">Add</button>
                    </div>
                  </form>
                  <ul className="divide-y divide-slate-800">
                    {data.expenses.map(item => (
                      <li key={item.id} className="py-2.5 flex justify-between text-sm items-center">
                        <span className="text-slate-200">{item.name} <span className="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded ml-1">{item.category}</span></span>
                        <div className="flex gap-2 items-center">
                          <span className="font-bold text-white">{formatCurrency(item.amount)}</span>
                          <button onClick={() => setData(p => ({ ...p, expenses: p.expenses.filter(i => i.id !== item.id) }))} className="text-slate-500 hover:text-rose-400"><Trash2 className="w-4 h-4" /></button>
                        </div>
                      </li>
                    ))}
                  </ul>
                </section>
              </div>
            )}

            {activeTab === 'debts' && (
              <div className="space-y-5 animate-fadeIn">
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-bold uppercase text-slate-300">Add Consumer Debt</h2>
                  <form onSubmit={handleAddDebt} className="space-y-2">
                    <input type="text" placeholder="Debt Name (e.g. Credit Card)" value={debtName} onChange={e => setDebtName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    <div className="grid grid-cols-3 gap-2">
                      <input type="number" placeholder="Balance ($)" value={debtBalance} onChange={e => setDebtBalance(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                      <input type="number" placeholder="APR (%)" value={debtApr} onChange={e => setDebtApr(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                      <input type="number" placeholder="Min Pmt ($)" value={debtMin} onChange={e => setDebtMin(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 h-11 rounded-xl text-white font-semibold">Add Debt</button>
                  </form>
                  <ul className="divide-y divide-slate-800">
                    {data.debts.map(d => (
                      <li key={d.id} className="py-2.5 flex justify-between items-center text-sm">
                        <div>
                          <p className="font-bold text-white">{d.name}</p>
                          <p className="text-xs text-slate-400">{formatCurrency(d.balance)} @ {d.interest_rate_apr}% APR</p>
                        </div>
                        <button onClick={() => setData(p => ({ ...p, debts: p.debts.filter(i => i.id !== d.id) }))} className="text-slate-500 hover:text-rose-400"><Trash2 className="w-4 h-4" /></button>
                      </li>
                    ))}
                  </ul>
                </section>
              </div>
            )}

            {activeTab === 'student' && (
              <div className="space-y-5 animate-fadeIn">
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-bold uppercase text-slate-300">Add Student Loan</h2>
                  <form onSubmit={handleAddStudentLoan} className="space-y-2">
                    <input type="text" placeholder="Loan Name" value={slName} onChange={e => setSlName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" placeholder="Balance ($)" value={slBalance} onChange={e => setSlBalance(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                      <input type="number" placeholder="APR (%)" value={slApr} onChange={e => setSlApr(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white" />
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 h-11 rounded-xl text-white font-semibold">Add Student Loan</button>
                  </form>
                  <ul className="divide-y divide-slate-800">
                    {(data.studentLoans || []).map(l => (
                      <li key={l.id} className="py-2.5 flex justify-between items-center text-sm">
                        <div>
                          <p className="font-bold text-white">{l.name}</p>
                          <p className="text-xs text-slate-400">{formatCurrency(l.balance)} @ {l.interest_rate_apr}%</p>
                        </div>
                        <button onClick={() => setData(p => ({ ...p, studentLoans: p.studentLoans.filter(i => i.id !== l.id) }))} className="text-slate-500 hover:text-rose-400"><Trash2 className="w-4 h-4" /></button>
                      </li>
                    ))}
                  </ul>
                </section>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-5 animate-fadeIn">
                <section className="grid grid-cols-2 gap-2.5">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                    <p className="text-[11px] uppercase text-slate-400">Total Debt</p>
                    <p className="text-lg font-extrabold text-white mt-1">{formatCurrency(metrics.totalDebtBalance)}</p>
                  </div>
                  <div className="bg-slate-900 border border-rose-500/30 rounded-2xl p-3.5">
                    <p className="text-[11px] uppercase text-rose-300">Interest Bleed</p>
                    <p className="text-lg font-extrabold text-rose-400 mt-1">{formatCurrency(metrics.monthlyInterestBleed)}/mo</p>
                  </div>
                </section>

                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-base font-bold text-white">Payoff Simulator</h2>
                    <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                      <button onClick={() => setPayoffStrategy('avalanche')} className={`px-3 py-1 rounded-lg text-xs font-bold ${payoffStrategy === 'avalanche' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Avalanche</button>
                      <button onClick={() => setPayoffStrategy('snowball')} className={`px-3 py-1 rounded-lg text-xs font-bold ${payoffStrategy === 'snowball' ? 'bg-sky-600 text-white' : 'text-slate-400'}`}>Snowball</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-3">
                      <p className="text-xs text-slate-400">Minimums Only Interest</p>
                      <p className="text-lg font-bold text-rose-400">{formatCurrency(baselineSim.totalInterest)}</p>
                      <p className="text-[10px] text-slate-500 mt-1">{baselineSim.months} months</p>
                    </div>
                    <div className="bg-slate-950 border border-emerald-500/30 rounded-xl p-3">
                      <p className="text-xs text-slate-400">Accelerated Interest</p>
                      <p className="text-lg font-bold text-emerald-400">{formatCurrency(acceleratedSim.totalInterest)}</p>
                      <p className="text-[10px] text-emerald-300 mt-1">Debt-free: {acceleratedSim.payoffDate}</p>
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* RESTORED SYNC / SHARE TAB WITH ALL FEATURES */}
            {activeTab === 'share' && (
              <div className="space-y-5 animate-fadeIn">
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
                  <h2 className="text-base font-bold text-white">Profile & Sync</h2>
                  
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Profile / User Name</label>
                    <input 
                      type="text" 
                      value={data.metadata?.user_name || ''} 
                      onChange={e => {
                        const val = e.target.value;
                        setData(p => ({ ...p, metadata: { ...p.metadata, user_name: val, updated_at: new Date().toISOString() } }));
                      }} 
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm h-11 text-white focus:outline-none focus:border-emerald-500" 
                      placeholder="Your Name"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={handleShareOrExport} className="w-full bg-emerald-600 hover:bg-emerald-500 h-11 rounded-xl text-white font-bold text-xs flex items-center justify-center gap-1.5 transition-colors">
                      <Download className="w-4 h-4" /> Export JSON
                    </button>
                    <button onClick={() => {
                      navigator.clipboard.writeText(getExportPayload());
                      setCopiedJson(true);
                      setTimeout(() => setCopiedJson(false), 2000);
                      showToast('Copied raw JSON to clipboard');
                    }} className="w-full bg-slate-800 hover:bg-slate-700 h-11 rounded-xl text-slate-200 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors">
                      {copiedJson ? <Check className="w-4 h-4 text-emerald-400" /> : <CopyIcon className="w-4 h-4" />}
                      {copiedJson ? 'Copied!' : 'Copy JSON'}
                    </button>
                  </div>

                  <div onClick={() => fileInputRef.current?.click()} className="border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-2xl p-5 text-center cursor-pointer bg-slate-950 transition-colors">
                    <input ref={fileInputRef} type="file" accept=".json" onChange={e => { const f = e.target.files?.[0]; if (f) { const r = new FileReader(); r.onload = ev => processImportedJson(ev.target.result); r.readAsText(f); } }} className="hidden" />
                    <Upload className="w-5 h-5 text-indigo-400 mx-auto mb-1" />
                    <p className="text-xs font-semibold text-slate-200">Tap to Load Profile JSON</p>
                    <p className="text-[10px] text-slate-500 mt-0.5">Restore data from a saved backup file</p>
                  </div>
                </section>

                <section className="bg-slate-900 border border-rose-900/40 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-bold uppercase text-rose-400">Data Management</h2>
                  <p className="text-xs text-slate-400">Load sample data to test app features or clear your storage completely.</p>
                  <div className="flex gap-2">
                    <button onClick={() => {
                      setData(SAMPLE_DATA);
                      showToast('Loaded sample profile');
                    }} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 h-10 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
                      <RefreshCw className="w-3.5 h-3.5" /> Load Sample Data
                    </button>
                    {confirmClear ? (
                      <button onClick={() => {
                        setData(EMPTY_DATA);
                        setConfirmClear(false);
                        showToast('Profile cleared');
                      }} className="flex-1 bg-rose-600 hover:bg-rose-500 text-white h-10 rounded-xl text-xs font-semibold transition-colors">
                        Confirm Clear
                      </button>
                    ) : (
                      <button onClick={() => setConfirmClear(true)} className="flex-1 bg-rose-950/60 border border-rose-800 text-rose-300 hover:bg-rose-900/60 h-10 rounded-xl text-xs font-semibold transition-colors">
                        Clear Profile
                      </button>
                    )}
                  </div>
                </section>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 border-t border-slate-800 px-1.5 py-1.5" style={{ paddingBottom: 'max(0.4rem, env(safe-area-inset-bottom))' }}>
            <div className="max-w-2xl mx-auto grid grid-cols-5 gap-1">
              {[
                { id: 'budget', label: 'Budget', icon: Wallet },
                { id: 'debts', label: 'Debts', icon: CreditCard },
                { id: 'student', label: 'Student', icon: GraduationCap },
                { id: 'dashboard', label: 'Payoff', icon: TrendingUp },
                { id: 'share', label: 'Sync', icon: Share2 }
              ].map(tab => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`h-12 rounded-xl flex flex-col items-center justify-center gap-1 ${isActive ? 'bg-emerald-500/15 text-emerald-400 font-bold' : 'text-slate-400'}`}>
                    <Icon className="w-5 h-5" />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
